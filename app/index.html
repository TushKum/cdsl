<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Pehla Kadam</title>
<style>
:root{
  --bg:#f6f3ee;--card:#ffffff;--ink:#1f2328;--mut:#5f6670;--line:#e7e1d6;
  --pri:#0f766e;--pri2:#0b5d57;--pri-l:#e2f3f0;
  --acc:#d97706;--acc-l:#fff3da;
  --up:#15803d;--up-l:#e7f6ec;--dn:#b91c1c;--dn-l:#fdecec;
  --rose:#be185d;--rose-l:#fde8f1;--r:16px;
  --sh:0 1px 2px rgba(31,35,40,.06),0 4px 14px rgba(31,35,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Nirmala UI",sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:92px}
.wrap{padding:12px 16px 16px}
h1{font-size:1.45rem;line-height:1.25;margin:4px 0 6px}
h2{font-size:1.15rem;margin:18px 0 8px}
h3{font-size:1rem;margin:0 0 4px}
p{margin:6px 0}
small,.mut{color:var(--mut)}
.hdr{position:sticky;top:0;z-index:20}
.top{background:var(--pri);color:#fff;padding:10px 16px 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.brand b{display:block;font-size:1.05rem}
.brand small{color:#cdeee9;font-size:.78rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langbtn{min-width:56px;min-height:40px;border-radius:999px;border:2px solid #fff;background:transparent;color:#fff;font-weight:700;padding:4px 12px}
.daybar{background:var(--pri2);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 16px}
.daybar .d{flex:1;min-width:0}
.daybar .d b{display:block;font-size:.95rem}
.daybar .d small{color:#bfe7e1;font-size:.74rem}
.nextbtn{min-height:44px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;padding:8px 14px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.nextbtn.done{background:#6b7280}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.7)}70%{box-shadow:0 0 0 12px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:8px 2px 10px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--mut)}
.nav button .i{font-size:1.3rem;line-height:1}
.nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin:10px 0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 18px;border-radius:14px;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:1rem;text-decoration:none}
.btn.block{display:flex;width:100%}
.btn.sec{background:var(--pri-l);color:var(--pri2)}
.btn.ghost{background:transparent;color:var(--pri2);border:2px solid var(--pri-l)}
.btn.buy{background:var(--up)}
.btn.sell{background:var(--dn)}
.btn.warn{background:var(--acc)}
.btn.rose{background:var(--rose)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;margin-top:12px}
.btns>*{flex:1}
.link{background:none;border:0;color:var(--pri);font-weight:700;padding:6px 0;min-height:36px;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-block;font-size:.72rem;padding:3px 8px;border-radius:999px;background:var(--acc-l);color:#92400e;font-weight:700}
.chip.g{background:var(--up-l);color:var(--up)}
.chip.r{background:var(--dn-l);color:var(--dn)}
.chip.t{background:var(--pri-l);color:var(--pri2)}
.chip.p{background:var(--rose-l);color:var(--rose)}
.up{color:var(--up)}.dn{color:var(--dn)}
.big{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:8px}
.kv div small{display:block;font-size:.75rem}
.kv div b{font-size:1rem}
.sakhi{display:flex;gap:10px;background:var(--rose-l);border-radius:var(--r);padding:12px;margin:10px 0}
.sakhi .av{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.sakhi b{color:var(--rose);font-size:.85rem}
.sakhi p{margin:2px 0;font-size:.95rem}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:.92rem}
.inp{width:100%;min-height:50px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:1.05rem}
.inp:focus{outline:none;border-color:var(--pri)}
.err{color:var(--dn);font-size:.88rem;min-height:1.2em;margin-top:6px;font-weight:600}
.hint{font-size:.8rem;color:var(--mut);margin-top:4px}
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--pri)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:14px;margin:8px 0;min-height:64px}
.opt.on{border-color:var(--pri);background:var(--pri-l)}
.opt .em{font-size:26px}
.boid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;font-weight:800;letter-spacing:.04em;background:var(--pri-l);color:var(--pri2);padding:12px;border-radius:12px;text-align:center;margin:8px 0}
.boid span{opacity:.55}
.flow{display:grid;gap:8px;margin-top:8px}
.flow .fr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flow .bx{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 8px;font-size:.82rem;font-weight:700}
.flow .bx.c{border-color:var(--pri);color:var(--pri2)}
.flow .ar{color:var(--mut);font-weight:800}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#14b8a6)}
.jl{list-style:none;padding:0;margin:6px 0 0}
.jl li button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 2px;min-height:44px;border-bottom:1px dashed var(--line);font-size:.95rem}
.jl li:last-child button{border-bottom:0}
.tick{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:.8rem;flex:none}
.tick.on{background:var(--up);border-color:var(--up);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;border:0;border-radius:var(--r);box-shadow:var(--sh);padding:12px 6px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.82rem;font-weight:700;position:relative;text-align:center}
.tile .i{font-size:1.6rem}
.badge{position:absolute;top:6px;right:8px;background:var(--dn);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 6px}
.stk{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:0;border-radius:14px;box-shadow:var(--sh);padding:12px;margin:8px 0;text-align:left;min-height:64px}
.em{width:40px;height:40px;border-radius:12px;background:var(--pri-l);display:grid;place-items:center;font-size:20px;flex:none}
.stk .nm{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk .px{text-align:right;font-weight:700}
.stk .px small{display:block;font-weight:700}
.qty{display:flex;gap:8px;align-items:center}
.qty button{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:1.4rem;font-weight:800;flex:none}
.qty .inp{text-align:center;font-weight:800}
.hold{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:12px;margin:8px 0}
.hold .kv{grid-template-columns:repeat(3,1fr)}
.list{list-style:none;padding:0;margin:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem;display:flex;gap:10px;justify-content:space-between}
.list li:last-child{border-bottom:0}
.paper{background:#fffdf8;border:1px solid #e3dccd;border-radius:6px;padding:14px;font-size:.86rem;box-shadow:var(--sh)}
.paper .hd{border-bottom:3px double #cfc5b0;padding-bottom:8px;margin-bottom:8px;text-align:center}
.paper .hd b{font-size:1rem;display:block}
.paper table{width:100%;border-collapse:collapse;margin:6px 0}
.paper th,.paper td{text-align:left;padding:6px 4px;border-bottom:1px solid #eee6d6;vertical-align:top}
.paper th{font-size:.74rem;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.paper td.n,.paper th.n{text-align:right}
.paper .sec{font-weight:800;margin-top:12px;color:var(--pri2)}
.stamp{display:inline-block;border:2px solid var(--rose);color:var(--rose);border-radius:6px;padding:2px 8px;font-weight:800;font-size:.72rem;transform:rotate(-3deg);margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.chips button{flex:none;min-height:40px;border-radius:999px;border:2px solid var(--line);background:#fff;padding:6px 14px;font-weight:700}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chat{background:#e9e2d6;border-radius:var(--r);overflow:hidden;margin:10px 0}
.chat .ch{background:#075e54;color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.chat .ch .av{width:36px;height:36px;border-radius:50%;background:#cfd8dc;display:grid;place-items:center;font-size:18px}
.chat .body{padding:14px 12px 16px;min-height:120px}
.bubble{background:#fff;border-radius:0 12px 12px 12px;padding:10px 12px;max-width:92%;box-shadow:0 1px 1px rgba(0,0,0,.12);font-size:.98rem}
.bubble small{display:block;text-align:right;font-size:.7rem;margin-top:4px}
.fb{border-radius:var(--r);padding:12px;margin-top:10px}
.fb.ok{background:var(--up-l)}.fb.no{background:var(--dn-l)}
.sms{background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;border-left:4px solid var(--pri);box-shadow:var(--sh);font-size:.9rem}
.sms.b{border-left-color:var(--acc)}.sms.c{border-left-color:var(--rose)}
.sms .from{font-weight:800;font-size:.78rem;display:flex;justify-content:space-between;gap:8px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:520px){.ov{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .hero{font-size:44px;text-align:center}
.sheet h2{text-align:center;margin-top:4px}
.lesson ul{padding-left:20px;margin:8px 0}
.lesson li{margin:8px 0}
.phone{background:#111827;border-radius:22px;padding:14px 10px}
.phone .sms{margin:6px 0}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;max-width:440px;width:calc(100% - 32px);pointer-events:none}
#toast div{background:#1f2937;color:#fff;border-radius:12px;padding:12px 14px;margin-top:6px;font-weight:600;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s}
.hero-w{background:linear-gradient(160deg,var(--pri) 0%,#14b8a6 100%);color:#fff;border-radius:22px;padding:22px 18px;margin-top:8px}
.hero-w h1{font-size:1.6rem}
.hero-w ul{padding-left:0;list-style:none}
.hero-w li{display:flex;gap:10px;margin:10px 0}
.note{background:var(--acc-l);border-radius:var(--r);padding:12px;font-size:.92rem;margin:10px 0}
.empty{text-align:center;padding:22px 12px;color:var(--mut)}
.empty .i{font-size:40px}
.cal li{align-items:center}
.cert{text-align:center;border:6px double var(--acc);border-radius:16px;padding:18px;background:#fffbef}
.lsn{display:flex;gap:12px;align-items:center;width:100%;background:#fff;border:0;border-radius:14px;box-shadow:var(--sh);padding:12px;margin:8px 0;text-align:left;min-height:60px}
.dash-chart{position:relative}
.dash-chart .tip{position:absolute;top:0;pointer-events:none;background:#1f2328;color:#fff;border-radius:10px;padding:6px 9px;font-size:.78rem;line-height:1.35;white-space:nowrap;transform:translateX(-50%);display:none;z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--mut);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid}
.legend i.dash{border-top-style:dashed}
.abar{margin:10px 0}
.abar .tr{height:10px;border-radius:5px;background:#efebe4;overflow:hidden}
.abar .tr i{display:block;height:100%;border-radius:0 4px 4px 0}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mini .card{margin:0}
details summary{cursor:pointer;color:var(--pri);font-weight:700;min-height:40px;display:flex;align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th,.tbl td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child,.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.foot{font-size:.75rem;color:var(--mut);text-align:center;margin:20px 0 6px}
svg{display:block}
</style>
</head>

  L:{
    kyc:{t:'What is KYC?', b:['KYC = Know Your Customer. It proves your identity (PAN) and address (Aadhaar or another proof).','You do it only once. It is stored with a KYC Registration Agency (KRA), so other brokers can reuse it.','Your PAN links all your investments for tax, so keep it safe.','Share KYC documents only with your SEBI-registered broker, never with “agents” on WhatsApp.']},
    accounts:{t:'Trading account vs demat account', b:['Trading account: like a wallet at your broker. It holds money and is used to place buy/sell orders.','Demat account: like a bank locker for shares. It holds your shares electronically, in your own name, at a depository such as CDSL.','Broker: a member of the stock exchange who places your orders. Usually also your Depository Participant (DP).','Depository (CDSL): keeps the official record of who owns which share. Your broker cannot change it without your approval.','If a broker closes down, the shares in your demat account remain yours.']},
    boid:{t:'Your BO ID', b:['BO ID = Beneficial Owner ID, a 16-digit number that identifies your demat account at CDSL.','First 8 digits = DP ID (your broker/DP). Last 8 digits = your own client ID.','You need it for IPO applications, transfers and complaints. It is not a secret like a PIN, but share it only when needed.']},
    order:{t:'What happens when you buy', b:['A market order buys at the current price on the exchange.','The money leaves your trading account the same day.','The clearing corporation matches buyers and sellers, then the depository moves the shares.','Settlement happens on T+1: the next trading day after your trade day (T).']},
    settlement:{t:'T+1 settlement', b:['T = trade day. T+1 = the next trading day.','On T+1 the clearing corporation pays the seller, and the depository credits the shares straight into the buyer’s demat account.','India moved to T+1 settlement for shares in 2023, one of the fastest systems in the world.','Until settlement your shares show as “pending”. In this demo you cannot sell or pledge pending shares.']},
    alerts:{t:'Why depository alerts protect you', b:['Every time shares enter or leave your demat, CDSL sends you an SMS/email directly, not through your broker.','So you hear the truth from the “locker keeper” itself.','If you get a debit alert you did not approve, call your DP and CDSL at once.','Keep your own mobile number and email registered, never a broker’s or agent’s.']},
    tpin:{t:'TPIN & eDIS: your sell lock', b:['To sell, shares must leave your demat. CDSL asks for your TPIN (or OTP) to approve it. This is called eDIS (electronic Delivery Instruction Slip).','Without your approval nobody, not even your broker, can move your shares out.','Never share your TPIN or OTP with anyone who calls or messages you.','The sale money reaches you on T+1.']},
    cas:{t:'What is a CAS?', b:['CAS = Consolidated Account Statement. One statement showing all your shares, mutual funds and transactions across your demat accounts, linked by PAN.','The depository sends it for every month with a transaction (and at least once every 6 months otherwise).','Check it every month: are all the transactions yours? Do quantities match your broker’s app?','It is your independent proof of what you own.']},
    dividend:{t:'Dividend', b:['A dividend is a part of the company’s profit paid to shareholders in cash.','You get it only if you own the shares on the record date. With T+1 settlement, buy at least one trading day before.','It is paid per share: 100 shares × ₹6.50 = ₹650.','On the ex-date the share price usually falls by about the dividend amount.']},
    bonus:{t:'Bonus shares', b:['A bonus issue gives free extra shares to existing shareholders. 1:1 means one extra share for every share you hold.','The price adjusts down in the same ratio, so your total value stays the same.','The depository credits bonus shares directly to your demat account.','In a 1:1 bonus, your average buying price also halves.']},
    split:{t:'Stock split', b:['A split breaks one share into smaller pieces, for example 1 share → 5 shares.','Quantity goes up and price goes down in the same ratio. Value stays the same.','Companies split shares to make them affordable for small investors.','It is like changing a ₹500 note into five ₹100 notes: same money.']},
    pledge:{t:'Pledging shares', b:['Pledge = locking your shares as security with your broker to get margin (an extra trading limit).','The shares stay in your demat and your name: you still get dividends, bonus and voting rights.','You confirm every pledge yourself with an OTP sent directly by CDSL.','Risk: if prices fall you must add money. Otherwise the broker can invoke (sell) the pledged shares.','Pledge only if you understand margin trading. Beginners should usually avoid it.']},
    nominee:{t:'Nomination', b:['A nominee receives your shares if you pass away. You can add up to 10 nominees with percentage shares.','With a nominee: the transfer needs only a death certificate and a simple form.','Without one: the family needs legal-heir papers or a court succession certificate, which can take months and cost money.','SEBI asks every investor to either add a nominee or formally opt out. Adding one is a gift to your family.']},
    evoting:{t:'Your rights as a shareholder', b:['Owning a share means owning a small part of the company.','You can vote on dividends, directors, mergers and more, at the AGM or online through CDSL e-voting.','One share = one vote. Small votes add up.','You also have the right to receive annual reports and dividends, and to ask questions at the AGM.']},
    scam:{t:'Spotting investment scams', b:['No genuine investment guarantees returns.','Never share your OTP, TPIN or passwords.','Check every advisor on the SEBI website before you pay.','Use only apps from SEBI-registered brokers. Report fraud on cybercrime.gov.in or call 1930.']},
    bench:{t:'Comparing with the market', b:['A benchmark is a yardstick. Here it is all 10 companies bought in equal amounts and simply held.','If the market went up 5% and you went up 2%, your choices cost you 3%, even though you made money.','Many beginners do better by spreading money widely and holding for long, instead of picking a few shares.','Cash is safe from price falls, but over years inflation slowly shrinks what it can buy.']},
    pnl:{t:'Average price and gain/loss', b:['Average price = total money paid ÷ number of shares.','Gain/loss = (price now − average price) × quantity. It is only “on paper” until you sell.','Prices go up and down every day. Investing for longer smooths out the bumps.']}
  }
},

    {from:'राहुल स्टॉक गुरु 📈', av:'🤑', m:'नमस्ते! मैं YouTube पर 2 लाख फ़ॉलोअर वाला मशहूर स्टॉक एक्सपर्ट हूँ। ₹4,999 दीजिए और पक्की टिप्स के लिए मेरे VIP टेलीग्राम से जुड़िए। 100% सटीक! SEBI रजिस्ट्रेशन की कोई ज़रूरत नहीं 😎', a:'scam',
     e:'सिर्फ़ SEBI-रजिस्टर्ड सलाहकार या रिसर्च एनालिस्ट ही शेयर सलाह के पैसे ले सकते हैं। "पक्की टिप्स" और "100% सटीक" झूठ हैं। फ़ॉलोअर लाइसेंस नहीं होते।'},
    {from:'डीमैट हेल्पडेस्क', av:'⚠️', m:'ज़रूरी: KYC बाक़ी होने से आपका डीमैट अकाउंट आज ब्लॉक हो जाएगा। 2 घंटे में अपना TPIN और OTP भेजें या bit.ly/kyc-upd8 पर अपडेट करें।', a:'scam',
     e:'CDSL, आपका DP या ब्रोकर कभी भी आपका TPIN या OTP नहीं माँगेंगे। जल्दबाज़ी और अनजान छोटा लिंक = फ़िशिंग।'},
    {from:'शक्ति एडवाइज़र्स', av:'🏛️', m:'नमस्ते। हम SEBI रजिस्टर्ड इन्वेस्टमेंट एडवाइज़र हैं (रजि. नं. INA000012345)। हम तय सालाना फ़ीस लेते हैं, आपका पैसा कभी नहीं संभालते और रिटर्न का वादा नहीं कर सकते। निवेश बाज़ार जोखिमों के अधीन है। कृपया sebi.gov.in पर हमें जाँचें।', a:'safe',
     e:'यह सुरक्षित लगता है: इसमें रजिस्ट्रेशन नंबर है, रिटर्न का कोई वादा नहीं और जाँचने को कहा गया है। फिर भी कोई फ़ीस देने से पहले SEBI वेबसाइट पर नंबर ज़रूर जाँचें।'}
  ],

  L:{
    kyc:{t:'KYC क्या है?', b:['KYC यानी "अपने ग्राहक को जानें"। इससे आपकी पहचान (PAN) और पता (आधार या कोई और प्रमाण) साबित होता है।','यह सिर्फ़ एक बार होता है। यह KYC रजिस्ट्रेशन एजेंसी (KRA) में रखा जाता है, ताकि दूसरे ब्रोकर भी इसे इस्तेमाल कर सकें।','आपका PAN टैक्स के लिए आपके सारे निवेश जोड़ता है, इसलिए इसे संभालकर रखें।','KYC दस्तावेज़ सिर्फ़ अपने SEBI-रजिस्टर्ड ब्रोकर को दें, WhatsApp पर किसी "एजेंट" को कभी नहीं।']},
    accounts:{t:'ट्रेडिंग अकाउंट बनाम डीमैट अकाउंट', b:['ट्रेडिंग अकाउंट: ब्रोकर के पास आपका बटुआ। इसमें पैसा रहता है और इससे खरीद/बिक्री के ऑर्डर लगते हैं।','डीमैट अकाउंट: शेयरों का बैंक लॉकर। इसमें आपके शेयर इलेक्ट्रॉनिक रूप में, आपके अपने नाम पर, CDSL जैसी डिपॉज़िटरी में रहते हैं।','ब्रोकर: स्टॉक एक्सचेंज का सदस्य जो आपके ऑर्डर लगाता है। अक्सर यही आपका डिपॉज़िटरी पार्टिसिपेंट (DP) भी होता है।','डिपॉज़िटरी (CDSL): आधिकारिक रिकॉर्ड रखती है कि कौन-सा शेयर किसका है। ब्रोकर आपकी मंज़ूरी के बिना इसे नहीं बदल सकता।','ब्रोकर बंद भी हो जाए, तो आपके डीमैट अकाउंट के शेयर आपके ही रहते हैं।']},
    boid:{t:'आपकी BO ID', b:['BO ID यानी बेनिफ़िशियल ओनर ID: 16 अंकों का नंबर जो CDSL में आपके डीमैट अकाउंट की पहचान है।','पहले 8 अंक = DP ID (आपका ब्रोकर/DP)। आख़िरी 8 अंक = आपकी अपनी क्लाइंट ID।','IPO आवेदन, ट्रांसफ़र और शिकायत में इसकी ज़रूरत पड़ती है। यह PIN जैसी गुप्त नहीं है, पर ज़रूरत होने पर ही बताएँ।']},
    order:{t:'खरीदने पर क्या होता है', b:['मार्केट ऑर्डर एक्सचेंज पर मौजूदा भाव पर खरीदता है।','पैसा उसी दिन आपके ट्रेडिंग अकाउंट से कट जाता है।','क्लियरिंग कॉर्पोरेशन खरीदारों और बेचने वालों का मिलान करता है, फिर डिपॉज़िटरी शेयर ट्रांसफ़र करती है।','सेटलमेंट T+1 पर होता है: आपके सौदे के दिन (T) के अगले कारोबारी दिन।']},
    settlement:{t:'T+1 सेटलमेंट', b:['T = सौदे का दिन। T+1 = अगला कारोबारी दिन।','T+1 पर क्लियरिंग कॉर्पोरेशन बेचने वाले को पैसा देता है और डिपॉज़िटरी शेयर सीधे खरीदार के डीमैट अकाउंट में जमा करती है।','भारत ने 2023 में शेयरों के लिए T+1 सेटलमेंट अपनाया, जो दुनिया की सबसे तेज़ व्यवस्थाओं में से है।','सेटलमेंट तक शेयर "पेंडिंग" दिखते हैं। इस डेमो में पेंडिंग शेयर बेचे या गिरवी नहीं रखे जा सकते।']},
    alerts:{t:'डिपॉज़िटरी अलर्ट आपकी रक्षा क्यों करते हैं', b:['जब भी शेयर आपके डीमैट में आते या जाते हैं, CDSL सीधे आपको SMS/ईमेल भेजती है, ब्रोकर के ज़रिए नहीं।','यानी सच आपको सीधे "लॉकर रखने वाले" से पता चलता है।','अगर ऐसा डेबिट अलर्ट आए जिसकी मंज़ूरी आपने नहीं दी, तो तुरंत अपने DP और CDSL को फ़ोन करें।','अपना ही मोबाइल नंबर और ईमेल दर्ज रखें, किसी ब्रोकर या एजेंट का कभी नहीं।']},
    tpin:{t:'TPIN और eDIS: बिक्री का ताला', b:['बेचने पर शेयर आपके डीमैट से बाहर जाते हैं। CDSL इसकी मंज़ूरी के लिए आपका TPIN (या OTP) माँगती है। इसे eDIS (इलेक्ट्रॉनिक डिलीवरी इंस्ट्रक्शन स्लिप) कहते हैं।','आपकी मंज़ूरी के बिना कोई भी, आपका ब्रोकर भी, आपके शेयर बाहर नहीं ले जा सकता।','फ़ोन या मैसेज करने वाले किसी को भी अपना TPIN या OTP कभी न बताएँ।','बिक्री का पैसा T+1 पर मिलता है।']},
    cas:{t:'CAS क्या है?', b:['CAS यानी कंसॉलिडेटेड अकाउंट स्टेटमेंट। एक ही स्टेटमेंट में आपके सभी डीमैट अकाउंट के शेयर, म्यूचुअल फ़ंड और लेन-देन, PAN से जुड़े हुए।','जिस महीने लेन-देन हो, डिपॉज़िटरी इसे भेजती है (वरना कम से कम हर 6 महीने में एक बार)।','हर महीने जाँचें: क्या सारे लेन-देन आपके हैं? क्या मात्रा ब्रोकर ऐप से मिलती है?','यह आपके पास क्या है, इसका स्वतंत्र सबूत है।']},
    dividend:{t:'डिविडेंड (लाभांश)', b:['डिविडेंड कंपनी के मुनाफ़े का वह हिस्सा है जो शेयरधारकों को नकद मिलता है।','यह तभी मिलता है जब रिकॉर्ड डेट पर शेयर आपके पास हों। T+1 सेटलमेंट के कारण कम से कम एक कारोबारी दिन पहले खरीदें।','यह प्रति शेयर मिलता है: 100 शेयर × ₹6.50 = ₹650।','एक्स-डेट पर शेयर का भाव आमतौर पर लगभग डिविडेंड जितना गिर जाता है।']},
    bonus:{t:'बोनस शेयर', b:['बोनस इश्यू में मौजूदा शेयरधारकों को मुफ़्त अतिरिक्त शेयर मिलते हैं। 1:1 का मतलब है हर शेयर पर एक अतिरिक्त शेयर।','भाव उसी अनुपात में घटता है, इसलिए कुल मूल्य वही रहता है।','डिपॉज़िटरी बोनस शेयर सीधे आपके डीमैट अकाउंट में जमा करती है।','1:1 बोनस में आपकी औसत ख़रीद कीमत भी आधी हो जाती है।']},
    split:{t:'स्टॉक स्प्लिट', b:['स्प्लिट में एक शेयर छोटे टुकड़ों में बँट जाता है, जैसे 1 शेयर → 5 शेयर।','मात्रा बढ़ती है और भाव उसी अनुपात में घटता है। मूल्य वही रहता है।','कंपनियाँ शेयर स्प्लिट करती हैं ताकि छोटे निवेशक भी उन्हें ख़रीद सकें।','जैसे ₹500 के नोट को पाँच ₹100 के नोटों में बदलना: पैसा उतना ही।']},
    pledge:{t:'शेयर गिरवी रखना (प्लेज)', b:['प्लेज = मार्जिन (ट्रेडिंग की अतिरिक्त सीमा) पाने के लिए अपने शेयर ब्रोकर के पास ज़मानत के रूप में लॉक करना।','शेयर आपके डीमैट में और आपके नाम पर ही रहते हैं: डिविडेंड, बोनस और वोटिंग अधिकार मिलते रहते हैं।','हर गिरवी की पुष्टि आप ख़ुद CDSL के भेजे OTP से करते हैं।','जोखिम: भाव गिरे तो पैसा जमा करना होगा, वरना ब्रोकर गिरवी शेयर बेच (इनवोक) सकता है।','मार्जिन ट्रेडिंग समझते हों तभी गिरवी रखें। नए निवेशकों को आमतौर पर इससे बचना चाहिए।']},
    nominee:{t:'नॉमिनेशन (नामांकन)', b:['नॉमिनी को आपके न रहने पर आपके शेयर मिलते हैं। आप प्रतिशत हिस्सों के साथ 10 तक नॉमिनी जोड़ सकते हैं।','नॉमिनी होने पर: ट्रांसफ़र के लिए सिर्फ़ मृत्यु प्रमाणपत्र और एक आसान फ़ॉर्म चाहिए।','न होने पर: परिवार को उत्तराधिकारी के काग़ज़ या कोर्ट से सक्सेशन सर्टिफ़िकेट चाहिए, जिसमें महीनों और पैसे लग सकते हैं।','SEBI हर निवेशक से कहता है कि या तो नॉमिनी जोड़ें या औपचारिक रूप से मना करें। नॉमिनी जोड़ना परिवार के लिए तोहफ़ा है।']},
    evoting:{t:'शेयरधारक के रूप में आपके अधिकार', b:['शेयर रखने का मतलब है कंपनी का एक छोटा हिस्सा आपका है।','आप डिविडेंड, निदेशकों, विलय आदि पर AGM में या CDSL ई-वोटिंग से ऑनलाइन वोट दे सकते हैं।','एक शेयर = एक वोट। छोटे-छोटे वोट मिलकर फ़र्क़ डालते हैं।','आपको वार्षिक रिपोर्ट और डिविडेंड पाने तथा AGM में सवाल पूछने का भी अधिकार है।']},
    scam:{t:'निवेश धोखाधड़ी कैसे पहचानें', b:['कोई भी असली निवेश रिटर्न की गारंटी नहीं देता।','अपना OTP, TPIN या पासवर्ड कभी साझा न करें।','पैसा देने से पहले हर सलाहकार को SEBI वेबसाइट पर जाँचें।','सिर्फ़ SEBI-रजिस्टर्ड ब्रोकरों के ऐप इस्तेमाल करें। धोखाधड़ी की शिकायत cybercrime.gov.in पर करें या 1930 पर कॉल करें।']},
    bench:{t:'बाज़ार से तुलना', b:['बेंचमार्क एक पैमाना है। यहाँ यह सभी 10 कंपनियों को बराबर रकम में ख़रीदकर रखे रहना है।','अगर बाज़ार 5% बढ़ा और आप 2%, तो आपके फ़ैसलों से 3% कम मिला, भले ही आपको मुनाफ़ा हुआ।','कई नए निवेशकों के लिए पैसा कई जगह बाँटकर लंबे समय तक रखना, कुछ शेयर चुनने से बेहतर रहता है।','नकद भाव गिरने से सुरक्षित है, पर सालों में महँगाई उसकी ख़रीद-शक्ति धीरे-धीरे घटा देती है।']},
    pnl:{t:'औसत कीमत और लाभ/हानि', b:['औसत कीमत = कुल चुकाया पैसा ÷ शेयरों की संख्या।','लाभ/हानि = (अभी का भाव − औसत कीमत) × मात्रा। बेचने तक यह सिर्फ़ "काग़ज़ पर" है।','भाव रोज़ ऊपर-नीचे होते हैं। लंबे समय तक निवेश करने से उतार-चढ़ाव का असर कम होता है।']}
  }
}};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){let u=0;while(u===0)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const PX = {}, RAW = {}; // RAW = total-return style series (no bonus/split/dividend drop), used for the market benchmark
(function(){
  const r = mulberry32(20260601);
  STOCKS.forEach(st=>{
    let p = st.p; const a = [];
    for(let i=0;i<N;i++){ if(i>0) p = p*Math.exp(st.dr + st.v*gauss(r)); a.push(p); }
    PX[st.s] = a;
  });
  Object.keys(PX).forEach(k=>{ RAW[k] = PX[k].slice(); });
  CA.forEach(c=>{
    const a = PX[c.sym];
    for(let i=c.day+HIST;i<N;i++){ if(c.type==='div') a[i]-=c.amt; else a[i]/=c.f; }
  });
  Object.keys(PX).forEach(k=>{ PX[k] = PX[k].map(x=>Math.round(x*20)/20); });
})();

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nm(sym){ const s=SMAP[sym]; return s ? (S.lang==='hi'?s.hn:s.n) : sym; }
function num(n,d){ try{ return Number(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}); }catch(e){ return Number(n).toFixed(d); } }
function fm(n){ return (n<0?'−':'')+'₹'+num(Math.abs(n),2); }
function fm0(n){ return (n<0?'−':'')+'₹'+num(Math.round(Math.abs(n)),0); }
function sgn(n){ return (n>0?'+':n<0?'−':'')+'₹'+num(Math.abs(n),2); }
function pct(n){ return (n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(2)+'%'; }
function cls(n){ return n>0?'up':n<0?'dn':''; }
function price(sym,d){ if(d==null) d=S.day; d=Math.max(-HIST,Math.min(PLAY-1,d)); return PX[sym][d+HIST]; }
function dateOf(d){ return DATES[Math.max(0,Math.min(N-1,d+HIST))]; }
function loc(){ return S.lang==='hi'?'hi-IN':'en-IN'; }
function fdate(d,opt){
  const dt = dateOf(d);
  try{ return dt.toLocaleDateString(loc(), opt||{day:'2-digit',month:'short'}); }
  catch(e){ return dt.getDate()+'/'+(dt.getMonth()+1); }

function margin(){ let m=0; for(const k in S.hold){ m += S.hold[k].pl*price(k)*(1-HAIRCUT/100); } return m; }
function pledgedVal(){ let m=0; for(const k in S.hold){ m += S.hold[k].pl*price(k); } return m; }
function holdVal(){ let v=0; for(const k in S.hold) v += S.hold[k].q*price(k); return v; }
function pendVal(){ return S.pend.reduce((a,p)=>a+(p.side==='B'?p.q*price(p.sym):p.q*p.px),0); }
function netWorth(){ return S.cash + holdVal() + pendVal(); }

  if(o.sym){ o.co = nm(o.sym); o.isin = SMAP[o.sym] ? SMAP[o.sym].isin : ''; }

function addSms(k, v, from){ S.sms.push({d:S.day, k, v:v||{}, f:from||'cdsl'}); }

function addMs(k){
  if(S.ms[k]) return;
  S.ms[k] = S.day+1; addXP(50);
  toast(t('ms_done',{m:t('m_'+k)}));
  if(MS.every(m=>S.ms[m]) && !S.cert){ S.cert = true; openModal({type:'cert'}); }
}
function lessonOnce(id){ if(!S.learned[id]) openModal({type:'lesson', id}); }

function placeBuy(sym,q){
  const px = price(sym), amt = q*px;
  S.cash = Math.round((S.cash - amt)*100)/100;
  S.pend.push({id:S.seq++, side:'B', sym, q, px, d:S.day});
  addTx({k:'BUY', sym, q, px, amt});
  const first = !S.ms.buy;
  addMs('buy');
  if(first) lessonOnce('order');
}
function placeSell(sym,q){
  const px = price(sym), amt = q*px, h = S.hold[sym];
  h.q -= q;
  if(h.q<=0 && h.pl<=0) delete S.hold[sym];
  S.pend.push({id:S.seq++, side:'S', sym, q, px, d:S.day});
  addTx({k:'SELL', sym, q, px, amt, dq:-q});
  const from = S.sms.length;
  addSms('sms_dr',{sym, q, date:S.day});
  const first = !S.ms.sell;
  addMs('sell');
  openModal({type:'sms', from});
  if(first) lessonOnce('tpin');
}
function settle(p){
  if(p.side==='B'){
    const h = S.hold[p.sym] || (S.hold[p.sym] = {q:0, avg:0, pl:0});
    h.avg = (h.q*h.avg + p.q*p.px)/(h.q+p.q);
    h.q += p.q;
    addTx({k:'CR', sym:p.sym, q:p.q, dq:p.q});
    addSms('sms_cr',{sym:p.sym, q:p.q, date:S.day});
  } else {
    const amt = p.q*p.px;
    S.cash = Math.round((S.cash + amt)*100)/100;
    addTx({k:'PAYIN', sym:p.sym, q:p.q, amt});
    addSms('sms_pay',{sym:p.sym, amt}, 'broker');
  }
}
function applyCA(c){
  const h = S.hold[c.sym], held = !!(h && h.q>0);
  const m = {type:'ca', id:c.id, held, a:0, b:0, amt:0, p1:price(c.sym,S.day-1), p2:price(c.sym,S.day)};
  if(held){
    m.a = h.q;
    if(c.type==='div'){
      const amt = Math.round(h.q*c.amt*100)/100;
      S.cash = Math.round((S.cash+amt)*100)/100; m.amt = amt; m.b = h.q;
      addTx({k:'DIV', sym:c.sym, q:h.q, amt});
      addSms('sms_div',{sym:c.sym, q:h.q, amt}, 'co');
    } else {
      const add = h.q*(c.f-1), addPl = h.pl*(c.f-1);
      h.q += add; h.pl += addPl; h.avg = h.avg/c.f; m.b = h.q;
      addTx({k:c.type==='bonus'?'BONUS':'SPLIT', sym:c.sym, q:add, dq:add, dp:addPl});
      if(c.type==='bonus') addSms('sms_bonus',{sym:c.sym, q:add});
      else addSms('sms_split',{sym:c.sym, a:num(m.a,0), b:num(m.b,0)});
    }
  }
  S.caSeen[c.id] = 1;
  return m;
}
function nextDay(){
  if(S.day >= PLAY-1){ openModal({type:'end'}); return; }
  const from = S.sms.length, prevDay = S.day;
  S.day++;
  let settledBuy = false;
  S.pend = S.pend.filter(p=>{ if(p.d < S.day){ settle(p); if(p.side==='B') settledBuy = true; return false; } return true; });
  const caModals = CA.filter(c=>c.day===S.day).map(applyCA);
  if(dateOf(S.day).getMonth() !== dateOf(prevDay).getMonth()) addSms('sms_cas',{mDay:prevDay});
  if(S.plBase>0){
    const m = margin(), p = Math.round((1-m/S.plBase)*100);
    if(p>=5 && S.day-S.warnDay>=3){ S.warnDay = S.day; addSms('sms_warn',{p}, 'broker'); }
  }
  if(S.sms.length > from) openModal({type:'sms', from});
  if(settledBuy && !S.ms.settle){ addMs('settle'); lessonOnce('settlement'); lessonOnce('alerts'); }
  caModals.forEach(m=>{ openModal(m); addMs('corp'); });
  toast(t('to_next',{date:fdate(S.day,{day:'numeric',month:'long'})}));
  save(); render();
}

function casMonths(){
  const out = [];
  for(let d=0; d<=S.day; d++){
    const dt = dateOf(d), key = dt.getFullYear()*12+dt.getMonth();
    const last = out[out.length-1];
    if(!last || last.key!==key) out.push({key, first:d, last:d}); else last.last = d;
  }
  return out;
}

    const right = sc.ans.filter((a,i)=>a===SC[i].a).length;
    return `<div class="wrap"><button class="link" data-a="back">${t('back')}</button>
      <h1>${t('sc_title')}</h1>

      <div class="card"><h3>🚩 ${t('sc_flags')}</h3><ul class="list">${['sc_f1','sc_f2','sc_f3','sc_f4','sc_f5'].map(k=>`<li>${t(k)}</li>`).join('')}</ul></div>

const C_YOU = '#0d9488', C_MKT = '#d97706', C_CASH = '#9a948a';
const CH = {w:328, h:190, pl:58, pr:70, pt:10, pb:22};
// Rebuilds total worth for every simulated day by replaying the activity log
function worthSeries(){
  const out = [], q = {}, pb = {}; let cash = START_CASH, ps = 0, j = 0;
  for(let d=0; d<=S.day; d++){
    while(j<S.tx.length && S.tx[j].d<=d){
      const x = S.tx[j++];
      if(x.k==='BUY'){ cash -= x.amt; pb[x.sym] = (pb[x.sym]||0)+x.q; }
      else if(x.k==='CR') pb[x.sym] -= x.q;
      else if(x.k==='SELL') ps += x.amt;
      else if(x.k==='PAYIN'){ ps -= x.amt; cash += x.amt; }
      else if(x.k==='DIV') cash += x.amt;
      if(x.dq) q[x.sym] = (q[x.sym]||0)+x.dq;
    }
    let v = cash+ps;
    for(const k in q) v += q[k]*price(k,d);
    for(const k in pb) v += pb[k]*price(k,d);
    out.push(Math.round(v*100)/100);
  }
  return out;
}
function marketSeries(){
  const out = [];
  for(let d=0; d<=S.day; d++){
    let r = 0; STOCKS.forEach(s=>{ r += RAW[s.s][d+HIST]/RAW[s.s][HIST]; });
    out.push(Math.round(START_CASH*r/STOCKS.length*100)/100);
  }
  return out;
}
function fL(v){ return '₹'+(v/100000).toFixed(2)+t('db_lakh'); }
function worthChart(you, mkt){
  const {w, h, pl, pr, pt, pb} = CH, n = you.length;

  const pad = Math.max((mx-mn)*0.12, 500); mn -= pad; mx += pad;
  const x = i=>pl + (n>1 ? i/(n-1) : 0.5)*(w-pl-pr), y = v=>pt + (1-(v-mn)/(mx-mn))*(h-pt-pb);
  const line = arr=>arr.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const ticks = [mn+(mx-mn)*0.15, (mn+mx)/2, mx-(mx-mn)*0.15];
  // end labels: nudge apart so they never collide
  const ends = [{l:t('db_you'),v:you[n-1],c:C_YOU},{l:t('db_mkt'),v:mkt[n-1],c:C_MKT},{l:t('db_cash'),v:START_CASH,c:C_CASH}]
    .map(e=>Object.assign(e,{y:y(e.v)})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<14) ends[i].y = ends[i-1].y+14;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${t('db_chart')}">
    ${ticks.map(v=>`<line x1="${pl}" x2="${w-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#e7e1d6" stroke-width="1"/><text x="${pl-6}" y="${(y(v)+4).toFixed(1)}" font-size="10" fill="#5f6670" text-anchor="end">${fL(v)}</text>`).join('')}
    <line x1="${pl}" x2="${w-pr}" y1="${y(START_CASH).toFixed(1)}" y2="${y(START_CASH).toFixed(1)}" stroke="${C_CASH}" stroke-width="2" stroke-dasharray="5 4"/>
    <polyline fill="none" stroke="${C_MKT}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${line(mkt)}"/>
    <polyline fill="none" stroke="${C_YOU}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${line(you)}"/>
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(mkt[n-1]).toFixed(1)}" r="4" fill="${C_MKT}" stroke="#fff" stroke-width="2"/>
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(you[n-1]).toFixed(1)}" r="4.5" fill="${C_YOU}" stroke="#fff" stroke-width="2"/>
    ${ends.map(e=>`<text x="${w-pr+6}" y="${(e.y+4).toFixed(1)}" font-size="11" font-weight="700" fill="#1f2328">${esc(e.l)}</text>`).join('')}
    <text x="${pl}" y="${h-5}" font-size="10" fill="#5f6670">${fdate(0)}</text>
    <text x="${w-pr}" y="${h-5}" font-size="10" fill="#5f6670" text-anchor="end">${fdate(S.day)}</text>
    <line id="dx" x1="0" x2="0" y1="${pt}" y2="${h-pb}" stroke="#5f6670" stroke-width="1" opacity="0"/>
    <circle id="dy1" r="5" fill="${C_YOU}" stroke="#fff" stroke-width="2" opacity="0"/>
    <circle id="dy2" r="5" fill="${C_MKT}" stroke="#fff" stroke-width="2" opacity="0"/>
    <rect id="dhit" x="${pl-8}" y="0" width="${w-pl-pr+16}" height="${h}" fill="transparent" style="touch-action:pan-y"/>
  </svg>`;
}

function bindDash(){
  const hit = document.getElementById('dhit'), tip = document.getElementById('dtip'), box = document.getElementById('dchart');
  if(!hit || !DASH) return;
  const svg = hit.ownerSVGElement, n = DASH.you.length;
  const show = ev=>{
    const r = svg.getBoundingClientRect(), sx = CH.w/r.width, {pl, pr} = CH;
    const px = (ev.clientX - r.left)*sx;
    const i = n>1 ? Math.max(0,Math.min(n-1,Math.round((px-pl)/(CH.w-pl-pr)*(n-1)))) : 0;
    const all = DASH.you.concat(DASH.mkt,[START_CASH]);
    let mn = Math.min.apply(null,all), mx = Math.max.apply(null,all); const pad = Math.max((mx-mn)*0.12,500); mn -= pad; mx += pad;
    const X = pl + (n>1 ? i/(n-1) : 0.5)*(CH.w-pl-pr), Y = v=>CH.pt + (1-(v-mn)/(mx-mn))*(CH.h-CH.pt-CH.pb);
    const dx = document.getElementById('dx'), d1 = document.getElementById('dy1'), d2 = document.getElementById('dy2');
    dx.setAttribute('x1',X); dx.setAttribute('x2',X); dx.setAttribute('opacity','.6');
    d1.setAttribute('cx',X); d1.setAttribute('cy',Y(DASH.you[i])); d1.setAttribute('opacity','1');
    d2.setAttribute('cx',X); d2.setAttribute('cy',Y(DASH.mkt[i])); d2.setAttribute('opacity','1');
    tip.innerHTML = `<b>${fdate(i,{weekday:'short',day:'numeric',month:'short'})}</b><br><span style="color:#5eead4">●</span> ${t('db_you')}: ${fm0(DASH.you[i])}<br><span style="color:#fbbf24">●</span> ${t('db_mkt')}: ${fm0(DASH.mkt[i])}`;
    tip.style.display = 'block';
    const left = Math.max(70, Math.min(box.clientWidth-70, X/sx));
    tip.style.left = left+'px';
  };
  const hide = ()=>{ tip.style.display = 'none'; ['dx','dy1','dy2'].forEach(id=>document.getElementById(id).setAttribute('opacity','0')); };
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', hide);
}

      const fq = h ? h.q-h.pl : 0;
      return `<div class="hero">🔒</div><h2>${t('pl_q_t',{co:nm(m.sym)})}</h2>
        <p class="mut" style="text-align:center">${t('pl_free',{q:fq})} · ${fm(p)}</p>
        <label class="f" for="plq">${t('st_qty')}</label><input class="inp" id="plq" inputmode="numeric" value="${fq}">
        <p><b id="plm">${t('pl_get',{m:fm(fq*p*(1-HAIRCUT/100))})}</b></p><p class="hint">${t('pl_hc',{h:HAIRCUT,k:100-HAIRCUT})}</p>
        <div class="note">${t('pl_risk')}</div><div class="err" id="pl_err"></div>
        <div class="btns"><button class="btn ghost" data-a="close">${t('cancel')}</button><button class="btn" data-a="pledge_req">${t('pl_req')}</button></div>`;
    }
    case 'nomPrompt':
      return `<div class="hero">👨‍👩‍👧</div><h2>${t('n_p_t')}</h2><p>${t('n_p_b')}</p>${sakhi(t('n_sakhi'))}
        <button class="btn block rose" data-a="nom_now">${t('h_nom_btn')}</button>
        <button class="btn block ghost" style="margin-top:8px" data-a="nom_skip">${t('n_skip')}</button>`;
    case 'nomSkip': {
      const b = S.lang==='hi'
        ? ['परिवार को साबित करना होगा कि वे क़ानूनी वारिस हैं: सक्सेशन सर्टिफ़िकेट या उत्तराधिकार के काग़ज़, हलफ़नामे, क्षतिपूर्ति बॉन्ड।','इसमें महीनों लग सकते हैं और कोर्ट व नोटरी का ख़र्च भी।','नॉमिनी होने पर शेयर सिर्फ़ मृत्यु प्रमाणपत्र और एक आसान फ़ॉर्म से उनके नाम हो जाते हैं।','कई परिवारों को तो पता ही नहीं चलता कि शेयर थे। नॉमिनी जोड़कर यह रोकें।']
        : ['Your family must prove they are legal heirs: a succession certificate or legal-heir papers, affidavits and indemnity bonds.','This can take months and cost money in court and notary fees.','With a nominee, the shares move to them with just a death certificate and a simple form.','Many families never even learn the shares existed. Adding a nominee prevents that.'];
      return `<div class="hero">⚖️</div><h2>${t('n_sk_t')}</h2><div class="lesson"><ul>${b.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <button class="btn block rose" data-a="nom_now">${t('n_sk_ok')}</button>
        <button class="btn block ghost" style="margin-top:8px" data-a="nom_later">${t('n_sk_later')}</button>`;
    }
    case 'reset':
      return `<div class="hero">🔄</div><h2>${t('pr_reset')}</h2><p style="text-align:center">${t('pr_reset_q')}</p>
        <div class="btns"><button class="btn ghost" data-a="close">${t('cancel')}</button><button class="btn sell" data-a="reset_ok">${t('pr_reset_ok')}</button></div>`;
    case 'end':
      return `<div class="hero">🎓</div><h2>${t('end_t')}</h2><p style="text-align:center">${t('end_b')}</p>
        <div class="btns"><button class="btn ghost" data-a="close">${t('close')}</button><button class="btn" data-a="go_cas">${t('tl_cas')}</button></div>
        <button class="btn block sell" style="margin-top:10px" data-a="reset">${t('pr_reset')}</button>`;
    case 'cert':
      return `<div class="cert"><div style="font-size:56px">🏅</div><h2>${t('cert_t')}</h2><p><b>${esc(S.kyc.name)}</b></p><p>${t('cert_b',{name:esc(S.kyc.name.split(' ')[0])})}</p>
        <small>BO ID ${fmtBo(S.boId)} · ${S.xp} XP</small></div>
        <button class="btn block warn" style="margin-top:12px" data-a="close">${t('cert_ok')}</button>`;
  }
  return '';
}

/* ---------------- Render ---------------- */
const app = document.getElementById('app'), modalEl = document.getElementById('modal');
function header(){
  const done = S.day>=PLAY-1;
  return `<div class="hdr"><header class="top"><div class="brand"><span class="logo">👣</span><div><b>${t('app')}</b><small>${t('tag')}</small></div></div>
      <button class="langbtn" data-a="lang" aria-label="Language">${S.lang==='en'?'हिंदी':'EN'}</button></header>
    ${S.onb>=4?`<div class="daybar"><div class="d"><b>📅 ${fdate(S.day,{weekday:'short',day:'numeric',month:'short'})}</b><small>${t('day',{n:S.day+1,t:PLAY})} · ${t('sim')}</small></div>
      <button class="nextbtn ${done?'done':''} ${(!done && S.pend.length && S.day<3)?'pulse':''}" data-a="next">${done?t('simDone'):t('next')}</button></div>`:''}</div>`;
}
function nav(){
  const tabs = [['home','🏠'],['market','📈'],['portfolio','💼'],['learn','📚'],['profile','👤']];
  return `<nav class="nav">${tabs.map(([k,i])=>`<button class="${ui.tab===k?'on':''}" data-a="tab" data-x="${k}"><span class="i">${i}</span>${t('nav_'+(k==='portfolio'?'port':k))}</button>`).join('')}</nav>`;
}
function render(){
  document.documentElement.lang = S.lang==='hi'?'hi':'en';
  document.title = t('app');
  let body;
  if(S.onb===0) body = vWelcome();
  else if(S.onb===1) body = vKyc();
  else if(S.onb===2) body = vBroker();
  else if(S.onb===3) body = vCreated();
  else {
    const v = ui.view || ui.tab;
    if(v==='inbox') S.smsRead = S.sms.length;
    body = ({home:vHome, market:vMarket, stock:vStock, portfolio:vPortfolio, learn:vLearn, profile:vProfile,
             cas:vCas, pledge:vPledge, nominee:vNominee, vote:vVote, scam:vScam, inbox:vInbox, dash:vDash}[v] || vHome)();
  }
  app.innerHTML = header() + `<main>${body}</main>` + (S.onb>=4?nav():'');
  if(S.onb>=4 && ui.view==='dash') bindDash();
  renderModal();
}
function renderModal(){
  if(ui.modal){ modalEl.innerHTML = `<div class="ov"><div class="sheet" role="dialog" aria-modal="true">${modalHTML(ui.modal)}</div></div>`; document.body.classList.add('noscroll'); }
  else { modalEl.innerHTML = ''; document.body.classList.remove('noscroll'); }
}
function goView(v){
  const tabs = ['home','market','portfolio','learn','profile'];
  if(tabs.indexOf(v)>=0){ ui.tab = v; ui.view = null; } else ui.view = v;
  if(v==='cas'){ ui.casM = null; addMs('cas'); save(); }
  render(); window.scrollTo(0,0);
}

/* ---------------- Event handlers ---------------- */
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function setErr(id,msg){ const el = document.getElementById(id); if(el) el.textContent = msg; }
function readQty(){ const q = parseInt(val('qty'),10); return isNaN(q)?0:q; }
function updEst(){ const el = document.getElementById('est'); if(el) el.textContent = fm(Math.max(0,readQty())*price(ui.sym)); }
function rnd(n){ let s=''; for(let i=0;i<n;i++) s += Math.floor(Math.random()*10); return s; }

const ACT = {
  lang(){ S.lang = S.lang==='en'?'hi':'en'; save(); render(); },
  setlang(x){ S.lang = x; save(); render(); },
  ob_start(){ S.onb = 1; save(); render(); window.scrollTo(0,0); },
  kyc_demo(){ S.kyc = {name:'Sunita Sharma', pan:'ABCPS'+rnd(4)+'K', aad:'9'+rnd(11), mob:'98'+rnd(8)}; if(S.lang==='hi') S.kyc.name = 'सुनीता शर्मा'; save(); render(); },
  kyc_next(){
    const k = {name:val('k_name'), pan:val('k_pan').toUpperCase(), aad:val('k_aad').replace(/\s/g,''), mob:val('k_mob').replace(/\s/g,'')};
    S.kyc = k;
    if(!k.name) return setErr('k_err',t('k_e_name'));
    if(!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(k.pan)) return setErr('k_err',t('k_e_pan'));
    if(!/^\d{12}$/.test(k.aad)) return setErr('k_err',t('k_e_aad'));
    if(!/^[6-9]\d{9}$/.test(k.mob)) return setErr('k_err',t('k_e_mob'));
    S.onb = 2; save(); render(); window.scrollTo(0,0);
  },
  pick_broker(x){ S.broker = x; save(); render(); },
  broker_next(){
    if(!S.broker) return setErr('b_err',t('b_err'));
    const b = BROKERS.find(b=>b.id===S.broker);
    S.boId = b.dp + '000' + rnd(5); S.tpin = String(100000+Math.floor(Math.random()*900000));
    S.onb = 3; save(); render(); window.scrollTo(0,0);
  },
  ob_finish(){
    S.onb = 4; ui.tab = 'home'; ui.view = null;
    addSms('sms_welcome',{});
    addMs('onboard');
    lessonOnce('accounts');
    openModal({type:'nomPrompt'});
    save(); render(); window.scrollTo(0,0);
  },
  tab(x){ goView(x); },
  go(x){ goView(x); },
  back(){ ui.view = null; render(); window.scrollTo(0,0); },
  stock(x){ ui.sym = x; ui.qty = 1; ui.view = 'stock'; render(); window.scrollTo(0,0); },
  qty(x){ ui.qty = Math.max(1, readQty()+parseInt(x,10)); const el = document.getElementById('qty'); if(el) el.value = ui.qty; updEst(); setErr('o_err',''); },
  qtymax(){ ui.qty = Math.max(1, Math.floor(S.cash/price(ui.sym))); const el = document.getElementById('qty'); if(el) el.value = ui.qty; updEst(); },
  buy(){
    const q = readQty(); ui.qty = Math.max(1,q||1);
    if(q<1) return setErr('o_err',t('e_qty'));
    if(S.day>=PLAY-1) return setErr('o_err',t('e_last'));
    const need = q*price(ui.sym);
    if(need > S.cash+1e-6) return setErr('o_err',t('e_cash',{need:fm(need),have:fm(S.cash)}));
    openModal({type:'buy', sym:ui.sym, q});
  },
  buy_ok(){
    const m = ui.modal; if(!m || m.q*price(m.sym) > S.cash+1e-6) return closeModal();
    closeModal(); placeBuy(m.sym, m.q);
    toast(t('to_buy',{q:m.q, co:nm(m.sym)})); save(); render();
  },
  sell(){
    const q = readQty(); ui.qty = Math.max(1,q||1);
    if(q<1) return setErr('o_err',t('e_qty'));
    if(S.day>=PLAY-1) return setErr('o_err',t('e_last'));
    if(q > freeQ(ui.sym)) return setErr('o_err',t('e_hold',{q:freeQ(ui.sym)}));
    openModal({type:'sell', sym:ui.sym, q});
  },
  sell_ok(){
    const m = ui.modal;
    if(val('tpin') !== S.tpin) return setErr('tp_err',t('cs_err'));
    if(m.q > freeQ(m.sym)) return closeModal();
    closeModal(); placeSell(m.sym, m.q);
    ui.qty = 1;
    toast(t('to_sell',{amt:fm(m.q*price(m.sym)), date:fdate(S.day+1,{day:'numeric',month:'long'})})); save(); render();
  },
  next(){ nextDay(); },
  lesson(x){ openModal({type:'lesson', id:x}); },
  lesson_ok(x){ if(!S.learned[x]){ S.learned[x] = 1; addXP(10); } save(); closeModal(); render(); },
  close(){ closeModal(); },
  cas_m(x){ ui.casM = parseInt(x,10); render(); },
  go_cas(){ closeModal(); goView('cas'); },
  pledge_open(x){ openModal({type:'pledge', sym:x, step:1}); },
  pledge_req(){
    const m = ui.modal, q = parseInt(val('plq'),10), fq = freeQ(m.sym);
    if(!(q>=1)) return setErr('pl_err',t('e_qty'));
    if(q>fq) return setErr('pl_err',t('pl_free',{q:fq}));
    const otp = rnd(6).replace(/^0/,'7');
    addSms('sms_otp',{sym:m.sym, q, otp});
    ui.modal = {type:'pledge', sym:m.sym, q, otp, step:2, smsIdx:S.sms.length-1};
    save(); renderModal();
  },
  pledge_ok(){
    const m = ui.modal;
    if(val('otp') !== m.otp) return setErr('otp_err',t('pl_otp_err'));
    if(m.q > freeQ(m.sym)) return closeModal();
    S.hold[m.sym].pl += m.q;
    addTx({k:'PLG', sym:m.sym, q:m.q, dp:m.q});
    addSms('sms_plg',{sym:m.sym, q:m.q});
    S.plBase = margin();
    closeModal();
    const first = !S.ms.pledge; addMs('pledge'); if(first) lessonOnce('pledge');
    toast(t('pl_done')); save(); render();
  },
  unpledge(x){
    const h = S.hold[x]; if(!h || !h.pl) return;
    const q = h.pl; h.pl = 0;
    addTx({k:'UPLG', sym:x, q, dp:-q});
    addSms('sms_uplg',{sym:x, q});
    S.plBase = margin();
    toast(t('pl_undone')); save(); render();
  },
  nom_save(){
    const name = val('n_name'), rel = val('n_rel');
    if(!name || rel==='') return setErr('n_err',t('n_err'));
    S.nominee = {name, rel:parseInt(rel,10)}; S.nomSkip = false;
    addSms('sms_nom',{});
    const first = !S.ms.nominee; addMs('nominee'); if(first) lessonOnce('nominee');
    toast(t('n_done')); save(); render();
  },
  nom_skip(){ S.nomSkip = true; save(); ui.modal = {type:'nomSkip'}; render(); },
  nom_now(){ closeModal(); goView('nominee'); },
  nom_later(){ closeModal(); render(); },
  vote(x){
    const [sym,ch] = x.split('|'); if(S.votes[sym] || !S.hold[sym]) return;
    S.votes[sym] = ch;
    const from = S.sms.length; addSms('sms_vote',{sym});
    const first = !S.ms.vote; addMs('vote');
    toast(t('v_done')); openModal({type:'sms', from}); if(first) lessonOnce('evoting');
    save(); render();
  },
  scam_ans(x){ S.scam.ans[S.scam.i] = x; save(); render(); },
  scam_next(){
    S.scam.i++;
    const SC = tr('SC');
    if(S.scam.i >= SC.length && !S.scamDone){
      S.scamDone = true;
      const right = S.scam.ans.filter((a,i)=>a===SC[i].a).length;
      addXP(right*20); toast(t('sc_xp',{n:right*20})); addMs('scam');
    }
    save(); render(); window.scrollTo(0,0);
  },
  scam_again(){ S.scam = {i:0, ans:[]}; save(); render(); },
  reset(){ ui.modal = null; ui.queue = []; openModal({type:'reset'}); },
  reset_ok(){
    const lang = S.lang; S = fresh(lang); save();
    ui.tab = 'home'; ui.view = null; ui.modal = null; ui.queue = []; ui.casM = null;
    render(); window.scrollTo(0,0);
  },
  cert(){ openModal({type:'cert'}); }
};

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  const fn = ACT[el.dataset.a]; if(fn){ e.preventDefault(); fn(el.dataset.x, el); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='qty'){ setErr('o_err',''); updEst(); }
  if(e.target.id==='plq' && ui.modal && ui.modal.type==='pledge'){
    const q = parseInt(e.target.value,10)||0, el = document.getElementById('plm');
    if(el) el.textContent = t('pl_get',{m:fm(Math.max(0,q)*price(ui.modal.sym)*(1-HAIRCUT/100))});
  }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const id = e.target && e.target.id;
  if(id==='tpin') ACT.sell_ok(); else if(id==='otp') ACT.pledge_ok();
});

render();
</script>
</body>
</html>
